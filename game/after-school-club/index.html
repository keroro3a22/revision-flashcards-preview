<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>After-School Club · Play and Learn Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/huninn.css"/>
<link rel="stylesheet" href="../worlds.css?v=4"/>
<link rel="stylesheet" href="club.css?v=2"/>
<link rel="stylesheet" href="../../assets/account.css?v=8"/>
<script src="../../assets/supabase-public.js?v=1"></script>
<script src="../../assets/progress-sync.js?v=4"></script>
<script src="../../assets/account.js?v=19"></script>
<script>
(function () {
  var ok = false;
  try {
    var data = JSON.parse(localStorage.getItem('asc-player-v1') || 'null');
    ok = !!(data && data.seen && /^(evan|lily|ben|hannah)$/.test(data.id));
  } catch (e) {}
  var hash = (location.hash || '').replace('#', '');
  var screen = 'welcome';
  if (ok && hash === 'place-notice') screen = 'place';
  else if (ok && (hash === 'map' || hash === 'character' || hash === '')) screen = hash || 'map';
  else if (hash === 'character') screen = 'character';
  document.documentElement.setAttribute('data-asc', screen);
})();
</script>
</head>
<body>
<header class="prac-header">
  <a class="back" href="../">← Game</a>
  <h1>After-School Club</h1>
  <p class="sub">Banyan Court Primary School</p>
</header>
<main class="club">
  <section class="screen screen-pick">
    <div class="screen-top">
      <button type="button" class="text-back" id="pick-back" hidden>back to the map</button>
    </div>
    <p class="kicker">Banyan Court Primary School</p>
    <h2 id="who-title">Welcome to After-School Club.</h2>
    <p class="lead">Choose who you will be, then come into the school.</p>
    <div class="cast" role="radiogroup" aria-labelledby="who-title">
      <button type="button" class="cast-card" role="radio" aria-checked="false" data-player="evan" aria-label="Evan">
        <img src="art/players/evan.png?v=1" alt="Evan" width="584" height="1000" draggable="false"/>
      </button>
      <button type="button" class="cast-card" role="radio" aria-checked="false" data-player="lily" aria-label="Lily">
        <img src="art/players/lily.png?v=1" alt="Lily" width="765" height="1000" draggable="false"/>
      </button>
      <button type="button" class="cast-card" role="radio" aria-checked="false" data-player="ben" aria-label="Ben">
        <img src="art/players/ben.png?v=1" alt="Ben" width="793" height="999" draggable="false"/>
      </button>
      <button type="button" class="cast-card" role="radio" aria-checked="false" data-player="hannah" aria-label="Hannah">
        <img src="art/players/hannah.png?v=1" alt="Hannah" width="862" height="1000" draggable="false"/>
      </button>
    </div>
    <div class="enter-bar">
      <button type="button" class="go" id="enter-world" disabled>Enter the world</button>
    </div>
  </section>

  <section class="screen screen-map">
    <h2 class="sr-only">Campus map</h2>
    <div class="map-tools">
      <button type="button" class="who" id="change-character">
        <img id="who-img" alt="" width="64" height="64" src="art/players/evan.png?v=1"/>
        <span><strong id="who-name">You</strong><small>Change character</small></span>
      </button>
    </div>
    <p class="map-hint">Tap to explore different places.</p>
    <p class="place-note" id="map-note" aria-live="polite"></p>
    <div class="map-stage">
      <div class="map-board">
        <img class="map-art" src="art/campus-map.png?v=2" alt="Map of Banyan Court Primary School" width="1467" height="1238"/>
        <button type="button" class="map-hot" style="left:1%;top:39.3%;width:27.3%;height:33.6%" data-note="The playground will open later." aria-label="Playground"></button>
        <button type="button" class="map-hot" style="left:21.7%;top:13.4%;width:17.5%;height:32.3%" data-note="The library will open later." aria-label="Library"></button>
        <a class="map-hot" style="left:47.9%;top:1.8%;width:25.1%;height:36.2%" href="../clue-hunt/" aria-label="School Hall"></a>
        <button type="button" class="map-hot" style="left:40.3%;top:44.4%;width:19.6%;height:16.8%" data-open="notice" aria-label="Notice Board"></button>
        <button type="button" class="map-hot" style="left:27.2%;top:48.3%;width:14.2%;height:24.6%" data-note="The canteen will open later." aria-label="Canteen"></button>
        <button type="button" class="map-hot" style="left:71.9%;top:17.3%;width:17.5%;height:20.7%" data-note="The storeroom will open later." aria-label="Storeroom"></button>
        <button type="button" class="map-hot" style="left:33.7%;top:75.4%;width:19.6%;height:19.4%" data-note="This is the school gate." aria-label="School Gate"></button>
        <a class="case-file" style="left:53.2%;top:8.3%;width:14.5%;height:21.9%" href="../clue-hunt/" aria-label="Case 001. School Mystery.">
          <img src="art/case-001-file.png?v=2" alt="" width="1112" height="1414"/>
        </a>
      </div>
    </div>
  </section>

  <section class="screen screen-place">
    <div class="screen-top">
      <button type="button" class="text-back" id="place-back">back to the map</button>
    </div>
    <h2>Notice Board</h2>
    <img class="place-art" src="art/places/view-notice-board.jpg?v=1" alt="Notice Board" width="1600" height="1195"/>
  </section>
</main>
<script src="club.js?v=2"></script>
</body>
</html>
