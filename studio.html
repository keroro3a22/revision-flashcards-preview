<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit lessons · English Revision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/studio.css?v=1" />
  <script src="assets/supabase-public.js?v=1"></script>
  <script src="assets/vendor/supabase.js?v=1"></script>
</head>
<body class="studio-page">
  <main class="studio-wrap">
    <p><a href="profile.html">Back to profile</a></p>
    <h1>Edit lessons</h1>
    <p>Save draft keeps the change private. Publish is what the unit page shows after a refresh.</p>
    <div class="studio-filters">
      <label>Book <select id="filter-book"></select></label>
      <label>Series <select id="filter-series"></select></label>
      <label>Level <select id="filter-level"></select></label>
      <label>Term <select id="filter-term"></select></label>
      <label>Unit <select id="filter-unit"></select></label>
    </div>
    <p id="studio-note" class="studio-note" role="status" hidden></p>
    <p id="studio-empty" hidden>No cards in this lesson yet.</p>
    <div class="studio-scroll">
      <table class="studio-table">
        <thead>
          <tr>
            <th>#</th><th>English</th><th>中文</th><th>Part of speech</th><th>Syllables</th><th>Highlight</th>
            <th>Example</th><th>例句</th><th>Advanced</th><th>進階例句</th><th>Media</th><th>State</th><th></th>
          </tr>
        </thead>
        <tbody id="studio-rows"></tbody>
      </table>
    </div>
  </main>
  <script src="assets/studio.js?v=1"></script>
</body>
</html>
