  function boot(SETS) {

  function muted() {

  }

  function paintMute() {
    const on = muted();
    btnMute.setAttribute("aria-pressed", on ? "true" : "false");
    btnMute.setAttribute("aria-label", on ? "Turn sound on" : "Mute");
  }

  const artCache = new Map();
  function warmArt(src) {
    if (!src || artCache.has(src)) return;
    const im = new Image();
    artCache.set(src, im);
    im.src = src;
  }
  items.forEach((it) => warmArt(it.img));

  function showArt(src) {
    if (!src) {
      artOpen.hidden = true;
      return;
    }
    artOpen.hidden = true;
    warmArt(src);
    const cached = artCache.get(src);
    const paint = () => {
      if (!items[idx] || items[idx].img !== src) return;
      if ((art.getAttribute("src") || "") !== src) art.src = src;
      if (window.ImgFrame && items[idx].frame) ImgFrame.apply(art, items[idx].frame);
      const showing = art.complete && art.naturalWidth && String(art.currentSrc || "").indexOf(src) !== -1;
      artOpen.hidden = !showing;
    };
    if (cached.complete && cached.naturalWidth) paint();
    else cached.addEventListener("load", paint, { once: true });
  }

  function holdPicture() {
    if (artOpen.hidden) return;
    artOpen.style.height = artOpen.getBoundingClientRect().height + "px";
    artOpen.style.flex = "none";

  function releasePicture() {
    artOpen.style.height = "";
    artOpen.style.flex = "";
  }

  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (err) {
      return null;
    }
  }

  let soundBus = null;

  function output(ac) {
    if (soundBus) return soundBus;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 8;
    comp.ratio.value = 3;
    comp.attack.value = 0.003;
    comp.release.value = 0.12;
    const makeup = ac.createGain();
    makeup.gain.value = 1.7;
    comp.connect(makeup);
    makeup.connect(ac.destination);
    soundBus = comp;
    return soundBus;
  }

  function noiseBuffer(ac) {
    if (ac._bossNoise) return ac._bossNoise;
    const len = Math.floor(ac.sampleRate * 1.2);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i += 1) data[i] = Math.random() * 2 - 1;
    ac._bossNoise = buf;
    return buf;
  }

  function blip(freq, start, dur, type, peak) {
    try {
      const ac = ensureAudio();
      if (!ac || muted()) return;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak || 0.16, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain);
      gain.connect(output(ac));
      osc.start(start);
      osc.stop(start + dur + 0.02);
    } catch (err) {}
  }

  function playHit() {
    try {
      const ac = ensureAudio();
      if (!ac || muted()) return;
      const t = ac.currentTime;
      const dur = 0.78;
      const voice = ac.createOscillator();
      const over = ac.createOscillator();
      voice.type = "sawtooth";
      over.type = "square";
      voice.frequency.setValueAtTime(620, t);
      voice.frequency.exponentialRampToValueAtTime(430, t + 0.08);
      voice.frequency.exponentialRampToValueAtTime(130, t + dur);
      over.frequency.setValueAtTime(930, t);
      over.frequency.exponentialRampToValueAtTime(640, t + 0.08);
      over.frequency.exponentialRampToValueAtTime(190, t + dur);
      const wobble = ac.createOscillator();
      const wobbleAmt = ac.createGain();
      wobble.frequency.setValueAtTime(18, t);
      wobble.frequency.exponentialRampToValueAtTime(7, t + dur);
      wobbleAmt.gain.setValueAtTime(36, t);
      wobble.connect(wobbleAmt);
      wobbleAmt.connect(voice.frequency);
      wobbleAmt.connect(over.frequency);
      const mouth = ac.createBiquadFilter();
      mouth.type = "bandpass";
      mouth.Q.value = 8;
      mouth.frequency.setValueAtTime(2400, t);
      mouth.frequency.exponentialRampToValueAtTime(480, t + dur);
      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.42, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.24);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      voice.connect(mouth);
      over.connect(mouth);
      mouth.connect(gain);
      gain.connect(output(ac));
      const rasp = ac.createBufferSource();
      rasp.buffer = noiseBuffer(ac);
      const raspFilter = ac.createBiquadFilter();
      raspFilter.type = "bandpass";
      raspFilter.frequency.value = 1400;
      raspFilter.Q.value = 0.8;
      const raspGain = ac.createGain();
      raspGain.gain.setValueAtTime(0.0001, t);
      raspGain.gain.exponentialRampToValueAtTime(0.16, t + 0.04);
      raspGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      rasp.connect(raspFilter);
      raspFilter.connect(raspGain);
      raspGain.connect(output(ac));
      voice.start(t);
      over.start(t);
      wobble.start(t);
      rasp.start(t);
      const end = t + dur + 0.03;
      voice.stop(end);
      over.stop(end);
      wobble.stop(end);
      rasp.stop(end);
    } catch (err) {}
  }

  function playHurt() {
    try {
      const ac = ensureAudio();
      if (!ac || muted()) return;
      const t = ac.currentTime;
      const thump = ac.createOscillator();
      thump.type = "sine";
      thump.frequency.setValueAtTime(210, t);
      thump.frequency.exponentialRampToValueAtTime(48, t + 0.16);
      const thumpGain = ac.createGain();
      thumpGain.gain.setValueAtTime(0.0001, t);
      thumpGain.gain.exponentialRampToValueAtTime(0.55, t + 0.008);
      thumpGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      thump.connect(thumpGain);
      thumpGain.connect(output(ac));
      const crack = ac.createBufferSource();
      crack.buffer = noiseBuffer(ac);
      const crackFilter = ac.createBiquadFilter();
      crackFilter.type = "highpass";
      crackFilter.frequency.value = 1600;
      const crackGain = ac.createGain();
      crackGain.gain.setValueAtTime(0.42, t);
      crackGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      crack.connect(crackFilter);
      crackFilter.connect(crackGain);
      crackGain.connect(output(ac));
      const dur = 0.7;
      const growl = ac.createOscillator();
      const body = ac.createOscillator();
      growl.type = "sawtooth";
      body.type = "square";
      growl.frequency.setValueAtTime(78, t);
      growl.frequency.exponentialRampToValueAtTime(168, t + 0.16);
      growl.frequency.exponentialRampToValueAtTime(96, t + dur);
      body.frequency.setValueAtTime(52, t);
      body.frequency.exponentialRampToValueAtTime(110, t + 0.16);
      body.frequency.exponentialRampToValueAtTime(64, t + dur);
      const shake = ac.createOscillator();
      const shakeAmt = ac.createGain();
      shake.frequency.value = 6;
      shakeAmt.gain.value = 14;
      shake.connect(shakeAmt);
      shakeAmt.connect(growl.frequency);
      const throat = ac.createBiquadFilter();
      throat.type = "lowpass";
      throat.frequency.setValueAtTime(280, t);
      throat.frequency.exponentialRampToValueAtTime(900, t + 0.18);
      throat.frequency.exponentialRampToValueAtTime(340, t + dur);
      const roarGain = ac.createGain();
      roarGain.gain.setValueAtTime(0.0001, t);
      roarGain.gain.exponentialRampToValueAtTime(0.38, t + 0.06);
      roarGain.gain.exponentialRampToValueAtTime(0.2, t + 0.32);
      roarGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      growl.connect(throat);
      body.connect(throat);
      throat.connect(roarGain);
      roarGain.connect(output(ac));
      const breath = ac.createBufferSource();
      breath.buffer = noiseBuffer(ac);
      const breathFilter = ac.createBiquadFilter();
      breathFilter.type = "lowpass";
      breathFilter.frequency.value = 700;
      const breathGain = ac.createGain();
      breathGain.gain.setValueAtTime(0.0001, t);
      breathGain.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
      breathGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      breath.connect(breathFilter);
      breathFilter.connect(breathGain);
      breathGain.connect(output(ac));
      thump.start(t);
      crack.start(t);
      growl.start(t);
      body.start(t);
      shake.start(t);
      breath.start(t);
      const end = t + dur + 0.03;
      thump.stop(t + 0.22);
      crack.stop(t + 0.1);
      growl.stop(end);
      body.stop(end);
      shake.stop(end);
      breath.stop(end);
    } catch (err) {}

  function playWin() {
    [523, 659, 784, 1046].forEach((freq, i) => {
      const ac = ensureAudio();
      if (!ac) return;
      blip(freq, ac.currentTime + i * 0.12, 0.18, "square", 0.2);
    });
  }

  function playLose() {
    [392, 349, 294, 220].forEach((freq, i) => {
      const ac = ensureAudio();
      if (!ac) return;
      blip(freq, ac.currentTime + i * 0.14, 0.2, "triangle", 0.18);
    });

  function musicTick() {
    if (!musicOn) return;
    if (!muted()) {
      const ac = ensureAudio();
      if (ac) blip(melody[step % melody.length], ac.currentTime, 0.18, "triangle", 0.12);
    }
    step += 1;
    musicTimer = setTimeout(musicTick, 420);
  }

  function startMusic() {
    musicOn = true;
    if (musicTimer) return;

    void oni.offsetWidth;

  function renderLives(flash) {
    let html = "";
    for (let i = 0; i < 3; i++) {
      const lost = i >= lives;
      const pop = flash && !reduce && lost && i === lives;
      const cls = pop ? "heart is-dissolving" : ("heart" + (lost ? " lost" : ""));

    let html = "";
    for (let i = 0; i < n; i++) {
      const spent = i >= n - hits;
      const pop = flash && !reduce && spent && i === n - hits;
      html += '<span class="' + (pop ? "is-dissolving" : (spent ? "spent" : "")) + '"></span>';

  function joinParts(it) {
    const token = " " + it.answer + " ";
    const full = it.full || "";
    const at = full.indexOf(token);
    if (at < 0) return [full];
    return [full.slice(0, at + 1), "REL", full.slice(at + token.length - 1)];
  }

  function renderJoinStem(val, mode) {
    const it = items[idx];
    let html = "";
    joinParts(it).forEach((p) => {
      if (p === "REL") {
        const shown = val || "________";
        let cls = "blank";
        if (val) cls = mode === "ok" ? "blank ok" : "blank filled";
        html += '<span class="' + cls + '">' + shown + "</span>";
      } else html += p;
    });
    if (it.hard) html += '<span class="hard-badge">Harder</span>';
    prompt.innerHTML = html;
  }

  function renderPrompt(val, mode) {
    const it = items[idx];
    if (it.kind === "join") {
      renderJoinStem(val, mode);
      return;
    }
    let html = "", bi = 0;
    const vals = val == null ? null : BossAnswer.blankValues(val);
    it.parts.forEach((p) => {
      if (p === "____") {
        const v = vals && vals[bi] != null ? vals[bi] : "____";
        let cls = "blank";
        if (vals && vals[bi] != null) cls = mode === "ok" ? "blank ok" : "blank filled";
        html += '<span class="' + cls + '">' + v + "</span>";
        bi++;
      } else html += p;
    });
    if (it.hard) html += '<span class="hard-badge">Harder</span>';
    prompt.innerHTML = html;
  }

    const it = items[idx];
    locked = false;
    if (pending) clearTimeout(pending);
    pending = null;
    qNum.textContent = (idx + 1) + " / " + items.length;
    showArt(it.img || "");
    if (items[idx + 1]) warmArt(items[idx + 1].img);
    releasePicture();
    foot.hidden = true;
    reason.hidden = true;
    reason.textContent = "";
    battleQ.classList.remove("has-reason");
    pose(null);
    renderHp();
    renderLives();
    pair.hidden = true;
    pair.innerHTML = "";
    if (it.kind === "join") renderJoinStem(null);
    else renderPrompt(null);

    choices.innerHTML = "";
    it.options.forEach((opt, i) => {
      const line = document.createElement("div");
      line.className = "choice-line";
      const letter = document.createElement("span");
      letter.className = "choice-letter";
      letter.textContent = "ABCD".charAt(i) + ".";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.textContent = opt;
      btn.addEventListener("click", () => answer(opt, btn));
      line.append(letter, btn);
      choices.appendChild(line);
    });
  }

      localStorage.setItem(SET_KEY, String((setIndex + 1) % SETS.length));
    }

  function finish(won, preview) {
    if (pending) clearTimeout(pending);
    pending = null;
    stopMusic();
    if (won) playWin();
    else playLose();
    if (!preview) {
      advanceSetIfNeeded();
      if (won && lives >= 1 && !forced && window.Badges) {
        var grammarRewards = Badges.recordGrammarBoss(lives);
        if (window.GrammarProgress) GrammarProgress.show(grammarRewards);
      }
    }
    hud.hidden = true;
    quizSide.hidden = true;
    const done = document.getElementById("done");
    const actions = document.getElementById("done-actions");
    done.hidden = false;
    done.classList.toggle("is-defeat", !won);
    document.getElementById("done-art").classList.toggle("oni-align", !won);
    if (won) {
      document.getElementById("done-title").textContent = "Victory";
      document.getElementById("done-art").src = "../../assets/boss/victory.png?v=1";
      document.getElementById("done-sub").textContent = lives + (lives === 1 ? " life left" : " lives left");

      document.getElementById("done-title").textContent = "Try again";
      document.getElementById("done-art").src = "../../assets/boss/oni.png";
      document.getElementById("done-sub").textContent = "The next boss is waiting.";
      const again = "boss/" + (forced ? location.search : "");
      actions.innerHTML = '<a class="btn btn-primary" href="' + again + '">Try again</a>'
        + '<a class="btn btn-ghost" href="grammar-hub/" target="_top">Grammar practice</a>';
    }
  }

  function answer(opt, btn) {
    if (locked || !zoom.hidden) return;
    const it = items[idx];
    const ok = BossAnswer.matches(opt, it.answer);
    locked = true;
    if (ok) {
      const last = idx >= items.length - 1;
      pose(last ? "is-down" : "is-hurt");
      playHit();
      hits += 1;
      renderHp(true);
      if (it.kind === "join") renderJoinStem(it.answer, "ok");
      else renderPrompt(it.answer, "ok");
      holdPicture();
      choices.querySelectorAll(".choice-line").forEach((line) => {
        const choice = line.querySelector(".choice");
        choice.disabled = true;
        if (choice !== btn) line.hidden = true;
      });
      btn.classList.add("correct");
      reason.textContent = it.explain || "";
      reason.hidden = !it.explain;
      foot.hidden = false;
      return;
    }
    pose("is-lunge");
    playHurt();
    lives -= 1;
    renderLives(true);
    livesEl.classList.remove("is-hit");
    void livesEl.offsetWidth;
    livesEl.classList.add("is-hit");
    btn.classList.add("spent");
    btn.disabled = true;
    if (lives <= 0) {
      choices.querySelectorAll(".choice").forEach((c) => { c.disabled = true; });
      pending = setTimeout(() => finish(false), reduce ? 0 : 500);
      return;
    }
    locked = false;
  }

  window.RevisionTestVictory = function () {
    if (!zoom.hidden) closeZoom();
    finish(true, true);
  };

  window.RevisionTestAnswer = function () {
    const done = document.getElementById("done");
    if (done && !done.hidden) return;
    const it = items[idx];
    if (!it) return;
    const key = BossAnswer.answerKey(it.answer);
    const buttons = choices.querySelectorAll(".choice");
    for (let i = 0; i < buttons.length; i += 1) {
      if (buttons[i].textContent === key) {
        buttons[i].click();
        return;
      }
    }
  };

  btnNext.addEventListener("click", () => {
    if (foot.hidden || !zoom.hidden) return;
    if (pending) { clearTimeout(pending); pending = null; }
    if (idx >= items.length - 1) finish(true);
    else {
      idx += 1;
      render();
    }
  });

  art.addEventListener("load", () => {
    const it = items[idx];
    if (!it || !it.img || String(art.currentSrc || art.getAttribute("src") || "").indexOf(it.img) === -1) return;
    artOpen.hidden = !art.naturalWidth;
  });
  art.addEventListener("error", () => {
    artOpen.hidden = true;
  });
  artOpen.addEventListener("click", () => {
    if (artOpen.hidden || !art.getAttribute("src")) return;
    zoomImg.src = art.src;
    zoom.hidden = false;
  });
  document.getElementById("art-zoom-close").addEventListener("click", closeZoom);
  document.getElementById("art-zoom-x").addEventListener("click", closeZoom);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !zoom.hidden) closeZoom();
  });

  paintMute();
  btnMute.addEventListener("click", () => {
    try { localStorage.setItem(MUTE_KEY, muted() ? "0" : "1"); } catch (err) {}
    paintMute();
    if (!muted()) startMusic();
    else stopMusic();
  });
  document.addEventListener("pointerdown", () => {
    ensureAudio();
    startMusic();
  }, { once: true });
  startMusic();

  render();
  }
  var bakedSets = [set1Data, set2Data, set3Data, set4Data, set5Data];
  function startPublished(sets) { boot(sets && sets.length ? sets : bakedSets); }
  if (window.GrammarLive) {
    GrammarLive.load({ unit: 'mixed', mode: 'boss' }).then(startPublished, function () { startPublished(null); });
  } else {
    startPublished(null);
  }
})();
</script>
</body>
</html>
