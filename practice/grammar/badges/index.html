<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Badges · Play and Learn Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../assets/favicon.png?v=2" />
  <link rel="stylesheet" href="assets/site.css?v=58" />
<link rel="stylesheet" href="../../assets/account.css?v=6" />
<script src="../../assets/supabase-public.js?v=1"></script>
<script src="../../assets/progress-sync.js?v=3"></script>
<script src="../../assets/account.js?v=15"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="badges/" aria-label="Play and Learn Club"><img src="../../assets/logo.png?v=2" alt="" width="1554" height="734" /></a>
      <nav class="nav-plain" aria-label="Primary">
        <a class="nav-jump" href="badges/">Revision</a>
        <a class="nav-jump" href="badges/">Practice</a>
      </nav>
    </div>
  </header>
  <main class="badge-main">
    <h1>Badges</h1>
    <p class="badge-lead">Each badge says what to finish. This page does not keep a score.</p>
    <p class="badge-count" id="badge-count">2 of 11 earned</p>
    <div class="badge-grid" id="badge-grid" aria-live="polite"></div>
  </main>
  <script>
  (function () {
    var badges = [
      { title: '起步新手', english: 'First Steps', image: 'assets/badges/first-steps-locked.png', detail: 'Finish any one practice, including Grammar.', earned: false },
      { title: '配對高手', english: 'Match Master', image: 'assets/badges/match-master-locked.png', detail: 'Finish 3 different Memory Match sets.', earned: false },
      { title: '限時勇者', english: 'Timed Hero', image: 'assets/badges/timed-hero-locked.png', detail: 'Finish 3 different Timed Challenge sets.', earned: false },
      { title: '故事閱讀員', english: 'Story Reader', image: 'assets/badges/story-reader.png', detail: 'Finish 3 different Story Book sets.', earned: true, earnedLabel: '3 Nov' },
      { title: '組句高手', english: 'Sentence Linker', image: 'assets/badges/sentence-linker-locked.png', detail: 'Finish 3 different Join the sentences sets.', earned: false },
      { title: '對話練習生', english: 'Chat Practiser', image: '', detail: 'Finish 3 different Chat Quest sets.', earned: false },
      { title: '推理高手', english: 'Inference Ace', image: 'assets/badges/inference-ace.png', detail: 'Get the Chat Quest mystery right 3 times.', earned: true, earnedLabel: '3 Nov' },
      { title: 'Boss 挑戰者', english: 'Boss Beater', image: 'assets/badges/boss-beater-locked.png', detail: 'Clear Boss Round with at least 1 life left.', earned: false },
      { title: '全能練習生', english: 'All-rounder', image: 'assets/badges/all-rounder-locked.png', detail: 'Finish Fill, Letters, Match, and Timed once each, in the same book or in Mixed topic.', earned: false },
      { title: '詞組拼寫手', english: 'Phrase Speller', image: 'assets/badges/phrase-speller-locked.png', detail: 'Finish 3 different Missing Letters sets, all correct each time.', earned: false },
      { title: 'Hard 挑戰者', english: 'Hard Challenger', image: 'assets/badges/hard-challenger-locked.png', detail: 'Finish 3 different Fill Hard sets and 3 different Letters Hard sets, each at least 90% correct.', earned: false }
    ];
    var grid = document.getElementById('badge-grid');
    function addCard(b) {
      var card = document.createElement('article');
      card.className = 'badge-card ' + (b.earned ? 'is-earned' : 'is-locked');
      var art = document.createElement('div');
      art.className = 'badge-art';
      if (b.image) {
        var img = document.createElement('img');
        img.src = b.image;
        img.alt = '';
        art.appendChild(img);
      }
      var name = document.createElement('h2');
      name.className = 'badge-name';
      name.textContent = b.title;
      var english = document.createElement('p');
      english.className = 'badge-english';
      english.textContent = b.english;
      var how = document.createElement('p');
      how.className = 'badge-how';
      how.textContent = b.detail;
      card.appendChild(art);
      card.appendChild(name);
      card.appendChild(english);
      card.appendChild(how);
      if (b.earned) {
        var date = document.createElement('p');
        date.className = 'badge-date';
        date.textContent = 'Earned ' + b.earnedLabel;
        card.appendChild(date);
      }
      grid.appendChild(card);
    }
    badges.forEach(addCard);
  })();
  </script>
</body>
</html>
